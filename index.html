<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7EFDF">

<title>Kattb Ketab Invitation</title>
<meta name="description" content="You're invited to Mohamed &amp; Sohila's Kattb Ketab.">

<!-- Open Graph / Twitter Card — what a guest sees when this link is pasted
     into WhatsApp, iMessage, or any chat app. Absolute URLs on the image
     and og:url are required, not stylistic — WhatsApp/iMessage/Facebook
     fetch the image server-side, with no browser to resolve a relative
     path against.

     This is the mohamed-tamer branch's content, deployed separately at
     nour1029.github.io/mohamed-sohila-invitation/ — not solinvitations.com,
     which stays Mazen & Shams's. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://nour1029.github.io/mohamed-sohila-invitation/">
<meta property="og:title" content="Mohamed &amp; Sohila">
<meta property="og:description" content="You're invited to our Kattb Ketab.">
<meta property="og:image" content="https://nour1029.github.io/mohamed-sohila-invitation/assets/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Mohamed &amp; Sohila">
<meta name="twitter:description" content="You're invited to our Kattb Ketab.">
<meta name="twitter:image" content="https://nour1029.github.io/mohamed-sohila-invitation/assets/img/og-image.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Script font: Pinyon Script is the working default. All four candidates render
  side by side in _fonts.html — swap the pick here and in --font-script.
-->
<!-- Amiri is a proper Naskh face — the Bismillah must not fall back to a
     system font that mangles its diacritics. -->
<!-- Imperial Script matches the reference's own font for the "Two Souls..."
     lines exactly (its 'NewFonts' weight 300 resolves to Imperial Script). -->
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@400;500;600&family=Imperial+Script&family=Ovo&family=Pinyon+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<!-- Marks that scripting is available, before first paint. The reveal styles
     hang off this, so a failed script leaves content visible rather than
     stranding the whole invitation at opacity 0. -->
<script>document.documentElement.classList.add('js');</script>
</head>

<body>

<!-- ============================================================
     Phase 0 scaffold. Every <section> below is an empty labeled
     band; the phase that fills it is named in the badge.
     ============================================================ -->

<!-- 1 · Envelope gate — Phase 2. Outside <main>: it covers the page
     rather than being part of the document flow.

     Two stages, as on the reference: a still of the sealed envelope, then
     on tap a short video of it opening. The video fades out as it ends and
     the invitation is underneath. -->
<div class="gate" id="gate">

  <div class="gate__still" id="gate-still">
    <!-- The exact first frame of gate-video below, not a separate still —
         so the still-to-film handoff on tap is pixel-identical, zero jump. -->
    <img class="gate__img" src="assets/img/envelope-closed.jpg" alt=""
         width="720" height="1280" fetchpriority="high">

    <button class="gate__open" type="button" id="gate-open">
      <span class="cue">
        <span class="cue__chevron"></span>
        <span class="cue__label caps">Tap to open</span>
      </span>
      <span class="visually-hidden">Open the invitation</span>
    </button>
  </div>

  <!-- muted + playsinline are what make autoplay-after-gesture legal on
       iOS; without playsinline it takes over the whole screen. -->
  <div class="gate__film" id="gate-film" aria-hidden="true">
    <video id="gate-video" class="gate__video"
           src="assets/video/envelope-open-MS.mp4"
           muted playsinline preload="auto"></video>
  </div>

</div>

<main id="invitation">


  <!-- 2 · Hero — Phase 3. tabindex allows the gate to land focus here. -->
  <section id="hero" class="hero" tabindex="-1">
    <div class="hero__panel">

      <!-- The scene is a video: the swans drift, petals fall, light moves.
           poster is the still plate, so a browser that cannot decode HEVC
           shows the painting instead of a blank box. preload is none and
           playback starts on wedding:open — no reason to pull 7MB before
           the guest has opened the envelope. -->
      <!-- src is set directly rather than via <source type="video/quicktime">:
           browsers filter <source> by declared type, and Chrome reports no
           support for quicktime even where it decodes the file happily. A
           bare src lets it sniff, and a browser that genuinely cannot decode
           just keeps showing the poster. -->
      <video class="hero__bg" id="hero-video"
             src="assets/video/swans.mov"
             poster="assets/img/hero-scene.jpg"
             muted loop playsinline preload="none"
             width="720" height="1280" aria-hidden="true"></video>

      <div class="hero__words">
        <p class="hero__eyebrow" lang="ar" dir="rtl" data-reveal>حَفْلُ زِفَافٍ</p>
        <!-- Date and time are one fact — when — so they share a line with a
             separator rather than stacking as two. The divider is decorative
             and hidden from assistive tech; the two <time> elements each keep
             their own machine-readable datetime. -->
        <p class="hero__when display" data-reveal>
          <time data-wedding="date"></time>
          <span class="hero__when-sep" aria-hidden="true">|</span>
          <time data-wedding="time"></time>
        </p>
      </div>

      <h1 class="heading heading--names hero__names" data-reveal>
        <span data-wedding="couple.one"></span>
        <span class="amp" aria-hidden="true">&amp;</span>
        <span data-wedding="couple.two"></span>
      </h1>

      <p class="hero__cue cue cue--down" aria-hidden="true">
        <span class="cue__chevron"></span>
        <span class="cue__label script">Scroll down</span>
      </p>

    </div>
  </section>

  <!-- 3 · Bismillah / invitation — Phase 5 -->
  <section id="invitation-card" class="section">
    <div class="section__inner">
      <article class="card invite" data-reveal-stagger>

        <!-- Same floral cutouts the reference uses to flank its own invite
             card (assets/img/README.md — the Tilda IDs match exactly). WebP
             first, at the same width the reference itself requests. -->
        <picture>
          <source srcset="assets/img/invite-ivy-left.webp" type="image/webp">
          <img class="invite__ivy invite__ivy--start" src="assets/img/hero-floral-left.png" alt="" aria-hidden="true" width="480" height="736">
        </picture>
        <picture>
          <source srcset="assets/img/invite-ivy-right.webp" type="image/webp">
          <img class="invite__ivy invite__ivy--end" src="assets/img/hero-floral-right.png" alt="" aria-hidden="true" width="484" height="736">
        </picture>

        <img class="bismillah" src="assets/img/bismillah.png"
             alt="بِسْمِ ٱللّٰهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ — In the name of Allah, the Most Gracious, the Most Merciful"
             width="1022" height="312">

        <!-- Surah Ar-Rum 30:21 (excerpt) — "...and He placed between you
             affection and mercy..." — the verse almost every Arabic wedding
             invitation opens with. Live text in Amiri (a proper Naskh face,
             already loaded for its diacritics — see the <link> above), not
             the image it started as: see assets/img/README.md. -->
        <p class="invite__ayah" lang="ar" dir="rtl">وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً</p>

        <p class="invite__greeting" lang="ar" dir="rtl">
          بقلوب بملؤها الفرح والسعادة نتشرف بدعوتكم لحضور حفل زفاف
        </p>

      </article>
    </div>
  </section>

  <!-- 4 · Countdown — Phase 6. Sits on the plain cream ground, no card. -->
  <section id="countdown" class="section countdown">
    <div class="section__inner">
      <h2 class="heading" data-reveal><span>The Celebration Begins In</span></h2>

      <!-- No data-reveal here: the ink-wipe-in on scroll and the per-digit
           flip on tick are bespoke to the countdown and driven by
           initCountdown() itself, not the generic reveal engine. -->
      <div class="countdown__clock" id="countdown-clock">
        <div class="count">
          <span class="count__wrap"><span class="count__value" data-count="days">--</span></span>
          <span class="count__label" data-count-label="days">Days</span>
        </div>
        <span class="count__sep" aria-hidden="true">:</span>
        <div class="count">
          <span class="count__wrap"><span class="count__value" data-count="hours">--</span></span>
          <span class="count__label" data-count-label="hours">Hours</span>
        </div>
        <span class="count__sep" aria-hidden="true">:</span>
        <div class="count">
          <span class="count__wrap"><span class="count__value" data-count="minutes">--</span></span>
          <span class="count__label" data-count-label="minutes">Minutes</span>
        </div>
        <span class="count__sep" aria-hidden="true">:</span>
        <div class="count">
          <span class="count__wrap"><span class="count__value" data-count="seconds">--</span></span>
          <span class="count__label" data-count-label="seconds">Seconds</span>
        </div>
      </div>

      <!-- Shown once the date has passed; the clock is hidden then. -->
      <p class="countdown__after script" id="countdown-after" hidden></p>
    </div>
  </section>

  <!-- 6 · Venue + map — Phase 8 -->
  <section id="venue" class="section venue">
    <div class="section__inner">
      <article class="card card--paper venue__card" data-reveal-stagger>

        <!-- No flanking flourishes here: the design puts a single centred
             rule-and-palmette *under* the heading instead. -->
        <h2 class="heading"><span>Location</span></h2>

        <img class="venue__divider" src="assets/img/venue-divider.png"
             alt="" aria-hidden="true" width="203" height="48">

        <p class="venue__name" data-wedding="venue.name"></p>

        <!-- One line per WEDDING.venue.addressLines entry, filled by
             initVenue. The design breaks after "…6th of October City," and
             a single joined string wraps wherever the column happens to
             run out, which is rarely the same place. -->
        <p class="venue__address">
          <span class="venue__address-label">Address:</span>
          <span class="venue__address-lines"></span>
        </p>

        <!-- Line drawing of the hall. Transparent PNG: the stone is drawn as
             ink over paper, so it picks up whatever the card's fill is rather
             than sitting on a cream rectangle of its own. -->
        <img class="venue__art" src="assets/img/venue-building.png"
             alt="Line drawing of Laveora Wedding Hall — a domed stone hall with
                  a colonnaded entrance, flanked by cypress trees"
             width="1108" height="532" loading="lazy" decoding="async">
      </article>

      <div class="frame venue__frame" data-reveal>
        <div class="frame__inner">
          <!-- src is set from WEDDING.venue so the coordinates live in one
               place; loading=lazy keeps the heaviest thing on the page off
               the critical path. -->
          <iframe
            class="venue__map"
            id="venue-map"
            title="Map showing the Kattb Ketab venue"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen></iframe>
        </div>
      </div>

      <p class="venue__actions" data-reveal>
        <a class="link-caps" id="venue-directions" href="#">Open in Maps</a>
      </p>
    </div>
  </section>

  <!-- 9 · Closing — Phase 12 -->
  <section id="closing" class="closing">
    <div class="section__inner closing__words">
      <p class="heading closing__line" data-reveal>Hope to see you there!</p>
      <p class="closing__names display" data-wedding="couple.both" data-reveal></p>
    </div>

    <figure class="closing__figure" data-reveal>
      <!-- The polaroid photo you supplied, at its own 1024x1024, shipped
           whole with its white border kept — see assets/img/README.md.

           Capped at 1024px so it is never enlarged past its true size —
           see .closing__figure for why a photo this shape cannot also be
           edge-to-edge on a desktop. -->
      <img class="closing__photo" src="assets/img/couple.jpg"
           alt="A polaroid-style photo of the two of you"
           width="1024" height="1024" loading="lazy" decoding="async">
    </figure>
  </section>

</main>

<!-- Persistent music button — Phase 11.
     Stays hidden unless WEDDING.audioSrc is set, so an unconfigured
     player never shows a control that cannot do anything. -->
<button class="music" id="music-toggle" type="button" hidden aria-pressed="false">
  <span class="music__icon" aria-hidden="true"></span>
  <span class="visually-hidden" id="music-label">Play music</span>
</button>
<audio id="music-audio" loop preload="none"></audio>

<script src="js/main.js"></script>
</body>
</html>
